Name: GeoNadir Fair Geo
Description: |
  <br/>
  <br/>
  GeoNadir Fair Geo is an open collection of UAV (drone) survey datasets
  contributed through the GeoNadir platform and published as cloud-native
  geospatial files with a STAC-compatible catalog.
  <br/>
  <br/>
  Each dataset represents one UAV survey. Every dataset provides a normalized
  metadata file and a ZIP package of the original raw images. Where available,
  a dataset may also include an RGB orthomosaic, a multispectral orthomosaic,
  a Digital Surface Model (DSM), and a Digital Terrain Model (DTM), each stored
  as a Cloud Optimized GeoTIFF (COG) that can be read directly by GDAL,
  Rasterio, QGIS, and other cloud-native geospatial tools without downloading
  the full file.
  <br/>
  <br/>
  Users discover datasets through a STAC-compatible catalog and can search by
  capture date, upload date, spatial area of interest, and metadata fields such
  as IUCN habitat classification. The collection includes only datasets that
  GeoNadir is able to publish publicly under an open, no-fee license. Private
  workspace data and unpublished datasets are out of scope for this collection.
Documentation: https://github.com/Geonadir/open-data-examples/blob/main/OPEN_DATA_STRUCTURE.md
